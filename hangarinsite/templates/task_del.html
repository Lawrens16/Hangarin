{% extends 'index.html' %}
{% load static %}
{% block content %}
<div class="content">
  <div class="container-fluid">   
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="page-title m-0">📋 Task</h4>
      <a href="{% url 'task-list' %}" class="btn btn-secondary shadow-sm">
        <i class="ti ti-arrow-left"></i> Back to List
      </a>
    </div>
    <div class="card shadow-sm border-0 rounded-3">
      <div class="card-header bg-light border-0">
        <h5 class="card-title mb-1">Delete Task</h5>
        <p class="card-subtitle text-muted small">
          This action cannot be undone. Please confirm before deleting.
        </p>
      </div>
      <div class="card-body">
        <div class="row">
          <div class="col-md-6">
            <form action="" method="post" novalidate>
              {% csrf_token %}
              <p>Are you sure you want to delete <strong>"{{ object }}"</strong>?</p>
              <div class="d-flex gap-2 mt-3">
                <button type="submit" class="btn btn-danger btn-rounded px-4">
                  <i class="ti ti-trash"></i> Confirm Delete
                </button>
                <a href="{% url 'task-list' %}" class="btn btn-outline-secondary btn-rounded px-4">
                  Cancel
                </a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
